name: Android minimal
on:
  workflow_dispatch:
  push:
    branches: [prism-codex]
    paths: ['android/**', 'crates/prism-android/**', 'crates/prism-core/**', 'scripts/android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK and NDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Native build tooling
        run: cargo install cargo-ndk --version 4.0.0 --locked
      - name: Shared mobile policy tests
        run: cargo test -p prism-android --lib --locked
      - name: Build Android native libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/android/build-native.sh
      - name: Build APK and instrumentation
        run: bash android/gradlew -p android assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: prism-android-alpha
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/lint-results-debug.html
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prism-android-alpha
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android/test-emulator.sh apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results
          path: emulator-results/
