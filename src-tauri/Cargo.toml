[package]
name = "prism"
description = "Prism proxy client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
sha2 = "0.10"
futures = "0.3"
prism-core = { path = "../crates/prism-core" }
prism-service = { path = "../crates/prism-service" }
base64 = "0.22"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
boa_engine = "0.22.0"
regex = "1"
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
tauri-plugin-deep-link = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
