[package]
name = "prism-service"
description = "Prism TUN service: runs the proxy core as SYSTEM so TUN works without running Prism as administrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "prism_service"
path = "src/lib.rs"

[[bin]]
name = "prism-service"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
