[package]
name = "prism-core"
description = "Prism proxy core: mixed inbound, rule routing, AnyTLS/Trojan/VLESS/Shadowsocks/Hysteria2/TUIC/WireGuard/VMess outbounds, WebSocket/HTTPUpgrade/gRPC transports, Clash-compatible API"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "prism_core"
path = "src/lib.rs"

[[bin]]
name = "prism-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
clap = { version = "4", features = ["derive"] }
ipnet = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
netstack-smoltcp = "0.2"
socket2 = { version = "0.6", features = ["all"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = { version = "0.2", features = ["deterministic"] }
rustls-webpki = { version = "0.103", features = ["ring"] }
ring = "0.17"
brotli-decompressor = "4"
hmac = "0.12"
h3 = "0.0.8"
h3-quinn = "0.0.10"
bytes = "1"
blake2 = "0.10"
http = "1"
quinn = "0.11"
h2 = "0.4"
sha3 = "0.10"
aes = "0.8"
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "0.12", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "proto-ipv4-fragmentation", "proto-ipv6-fragmentation", "fragmentation-buffer-size-65536", "reassembly-buffer-size-65536", "reassembly-buffer-count-4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
